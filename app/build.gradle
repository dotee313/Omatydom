plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dotee313.omatydom.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dotee313.omatydom'
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName '0.9.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
